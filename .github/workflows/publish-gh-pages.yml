name: Publish to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: gh-pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ensure GitHub Pages source (gh-pages branch)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(gh api repos/${{ github.repository }}/pages --jq .status 2>/dev/null || echo "none")
          if [ "$status" = "none" ]; then
            echo "Configurando GitHub Pages → rama gh-pages..."
            gh api -X POST "repos/${{ github.repository }}/pages" \
              -f build_type=legacy \
              -f 'source[branch]=gh-pages' \
              -f 'source[path]=/' || true
          else
            echo "GitHub Pages ya configurado (status: $status)"
            gh api -X PUT "repos/${{ github.repository }}/pages" \
              -f build_type=legacy \
              -f 'source[branch]=gh-pages' \
              -f 'source[path]=/' || true
          fi

      - run: npm ci

      - name: Deploy Convex + build (automático con CONVEX_DEPLOY_KEY)
        id: convex_build
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "⚠ Sin CONVEX_DEPLOY_KEY — build sin backend en la nube."
            echo "   Ejecuta: npm run setup:once (una sola vez en tu PC)"
            exit 0
          fi
          echo "mode=convex" >> "$GITHUB_OUTPUT"
          npx convex deploy \
            --cmd 'npm run build:pages' \
            --cmd-url-env-var-name VITE_CONVEX_URL

      - name: Seed datos de demostración
        if: steps.convex_build.outputs.mode == 'convex'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex run seed:seed

      - name: Build for GitHub Pages (sin Convex)
        if: steps.convex_build.outputs.mode != 'convex'
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: npm run build:pages

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Resumen del despliegue
        if: always()
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "  App: https://ghostspecialtycoffee-lab.github.io/APP-dieguito/"
          if [ "${{ steps.convex_build.outputs.mode }}" = "convex" ]; then
            echo "  Convex: ✓ desplegado y datos semilla cargados"
          else
            echo "  Convex: pendiente — npm run setup:once"
          fi
          echo "═══════════════════════════════════════════════════════"
